<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Codex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Philosopher:wght@400;700&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@500;700&family=Orbitron&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=UnifrakturMaguntia&display=swap');
*{box-sizing:border-box}
body{margin:0;height:100vh;padding:10px;display:flex;flex-direction:column;gap:12px;overflow:hidden;color:#fff;font-family:'Cinzel',serif;
 background-color:#000;background-image:radial-gradient(circle at 15% 40%,rgba(255,0,0,.1),transparent 50%),radial-gradient(circle at 85% 15%,rgba(0,100,255,.08),transparent 50%)}
input,textarea{font:inherit;color:#fff;background:transparent;border:0;outline:0;min-width:0;transition:box-shadow .25s,background .25s}
input:focus,textarea:focus{box-shadow:0 2px 0 #f00;background:rgba(255,255,255,.04)}
::selection{background:rgba(255,0,0,.4)}
*{scrollbar-width:thin;scrollbar-color:#fff #000}::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:#fff}::-webkit-scrollbar-track{background:#000}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #fff;padding-bottom:10px;position:relative}
header::after{content:'';position:absolute;bottom:-3px;left:0;width:60px;height:3px;background:#f00}
.ttl{font:700 1.7em 'Cinzel Decorative',serif;letter-spacing:4px;text-shadow:0 0 14px rgba(255,255,255,.5)}
nav{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.b{position:relative;overflow:hidden;background:#000;border:2px solid #fff;color:#fff;font:600 .8em 'Cinzel',serif;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;cursor:pointer;
 transition:transform .2s,box-shadow .3s,background .3s,color .3s,border-color .3s}
.b::before{content:'';position:absolute;top:0;left:-120%;width:80%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .55s}
.b:hover::before{left:140%}
.b:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,0,0,.45);border-color:#f00}
.b:active{transform:translateY(1px) scale(.95);box-shadow:0 0 6px #f00}
.b.on{background:#fff;color:#000}
.b.s{padding:4px 10px;font-size:.62em;white-space:nowrap;opacity:0;transition:opacity .4s ease,transform .2s,box-shadow .3s,background .3s,color .3s,border-color .3s}
.sh:hover .b.s,.gh:hover .b.s,.b.s:focus-visible{opacity:1}
@media(hover:none){.b.s{opacity:1}}
.prow .b.s{opacity:1}
.x{background:none;border:0;color:#777;font-size:1.2em;line-height:1;cursor:pointer;padding:0 4px;transition:color .2s,transform .25s}
.x:hover{color:#f00;transform:rotate(90deg) scale(1.2)}

/* layout */
main{flex:1;min-height:0;display:grid;gap:12px;animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#sheet{grid-template-columns:minmax(440px,.85fr) minmax(0,1.6fr) minmax(280px,.95fr)}
#info{display:none;grid-template-columns:1fr 1fr 1.4fr}
[data-v=info] #sheet{display:none}[data-v=info] #info{display:grid}
.p{min-height:0;overflow-y:auto;padding:12px;border:2px solid #fff;background:linear-gradient(135deg,#000,#161616 50%,#000);box-shadow:0 0 25px rgba(255,255,255,.1),inset 0 0 25px #000}
label{display:block;font-size:.6em;letter-spacing:2px;text-transform:uppercase;color:#aaa}
label input{display:block;width:100%;font-size:1.5em;border-bottom:1px solid #555;padding:2px 0}

/* left */
.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#pf{position:relative;aspect-ratio:3/4;overflow:hidden;background:#080808}
#pim{position:absolute;display:none;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
#pf.has #pim{display:block}#pf.has #ph{display:none}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:2px dashed #555;margin:10px;cursor:pointer;
 font:700 1.1em 'Cinzel Decorative',serif;letter-spacing:2px;color:#ccc;transition:.3s}
#ph small{font:.55em 'Cinzel',serif;color:#777}#pf:hover #ph{border-color:#fff;background:rgba(255,255,255,.05)}
#pf.adj{cursor:grab;touch-action:none;outline:2px solid #f00}
#hint{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:.6em;letter-spacing:2px;text-shadow:0 0 6px #000;opacity:0;transition:.3s;pointer-events:none}
#pf.adj #hint{opacity:1}
.ov{position:absolute;left:0;right:0;bottom:4px;padding:34px 15px 17px;gap:6px;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.ov span{flex:1;display:flex;align-items:center;gap:3px;padding:3px 9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(3px)}
.ov svg{width:20px;height:20px;fill:currentColor;flex:none}
.dfp{position:absolute;top:15px;right:15px;max-width:62%;display:flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(3px)}.dfp svg{width:20px;height:20px;fill:#fff;flex:none}.dfp input{width:8ch;min-width:0;text-align:center;font:700 1.15em 'Cinzel Decorative',serif;text-shadow:0 2px 8px #000}
.hp{color:#f22}.hp svg{filter:drop-shadow(0 0 7px #f00)}.df svg{filter:drop-shadow(0 0 6px #fff)}
.ov input{flex:1;width:0;min-width:0;text-align:center;font:700 1.15em 'Cinzel Decorative',serif;text-shadow:0 2px 8px #000,0 0 12px rgba(255,255,255,.4)}
#hpbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#300}
#hpbar i{display:block;height:100%;width:0;background:#f00;box-shadow:0 0 10px #f00;transition:width .5s}
.prow{display:flex;gap:6px;align-items:center;margin-top:8px}
#zr{display:none;flex:1;accent-color:#f00}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.nm{font:700 1.7em 'Cinzel Decorative',serif;text-shadow:0 0 12px rgba(255,255,255,.5);border-bottom:3px solid #fff;padding:2px 0;width:100%}
.tt{font-style:italic;color:#ccc;border-bottom:1px solid #555;padding:2px 0;width:100%}
.g2{display:grid;grid-template-columns:1fr;gap:12px}.g2 input{font-size:1.9em}
.at{display:flex;align-items:center;gap:8px;border:1px solid #fff;padding:4px 8px;background:#050505;transition:.25s}
.at:hover{border-color:#f00;box-shadow:0 0 14px rgba(255,0,0,.3)}
.at b{font:700 1.7em 'Cinzel Decorative',serif;margin-right:1px}
.at span{flex:1;font-size:.82em;font-weight:700;letter-spacing:1px;line-height:1.2}
.at small{display:block;font-size:.72em;font-weight:400;color:#aaa;text-transform:none;font-style:italic;letter-spacing:0}
.at input{width:46px;height:40px;text-align:center;border:2px solid #fff;font:700 1.3em 'Cinzel Decorative',serif;background:#000}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sb div{border:2px solid #fff;padding:8px;text-align:center;background:#050505;font-size:.75em;letter-spacing:2px;text-transform:uppercase}
.sb input{width:5ch;text-align:center;font:700 1.5em 'Cinzel Decorative',serif;border-bottom:2px solid #fff}

/* sections */
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #fff;padding-bottom:6px;margin:0 0 10px}
.sh h3{margin:0;font:700 1.1em 'Cinzel Decorative',serif;letter-spacing:3px;text-transform:uppercase}
.sec{position:relative;overflow:hidden;min-height:150px;margin-bottom:18px;padding:10px;border:2px solid #fff;background:linear-gradient(135deg,#000,#0a0a0a);box-shadow:inset 0 0 15px #000}
.sec[data-k=traits]{--f:'Special Elite',monospace}.sec[data-k=bgs]{--f:'Special Elite',monospace}.sec[data-k=thau]{--f:'Philosopher',serif}.sec[data-k=cons]{--f:'IM Fell English SC',serif}.sec[data-k=cyber]{--f:'Orbitron',sans-serif}.sec[data-k=cyber] .sh h3{font-size:calc(1.1em - 3px)}.sec[data-k=cyber] .en{font-size:calc(.88em - 3px)}.sec[data-k=bles]{--f:'Cormorant Garamond',serif}
.sec[data-k=bles] .sh h3,.sec[data-k=bles] .gn,.sec[data-k=bles] .en{font-weight:700}
.sec[data-k] .sh h3,.sec[data-k] .gn,.sec[data-k] .en{font-family:var(--f)}
.grp{border:1px solid #666;padding:8px;margin-bottom:10px;background:#050505}
.gh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.gn{flex:1;font-weight:700;font-size:1em;letter-spacing:1px;border-bottom:2px solid #fff;padding:3px 0}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.ent{min-width:0;display:flex;align-items:center;gap:6px;padding:3px 6px;background:#0b0b0b;border-left:3px solid var(--c,#fff);animation:fi .3s;transition:background .2s,border-color .2s,padding-left .2s}
.ent:hover{background:#181818;border-color:#f00;padding-left:10px}
.en{flex:1;width:100%;font-size:.88em;padding:3px 0}
.th{width:30px;height:30px;flex:none;border:1px dashed #666;display:flex;align-items:center;justify-content:center;color:#777;cursor:pointer;overflow:hidden;transition:.2s}.th:hover{border-color:#fff;color:#fff}.th img{width:100%;height:100%;object-fit:cover}

/* hover box */
#tip{position:fixed;z-index:50;width:max-content;max-width:min(640px,94vw);padding:10px;align-items:flex-start;background:#000;border:2px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.2);
 display:flex;gap:10px;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .2s,transform .2s,visibility .2s}
#tip.on{opacity:1;visibility:visible;transform:none}
#ta{font-family:'Lora',serif;min-width:190px;max-width:520px;min-height:72px;border:1px solid #555;padding:6px;font-size:.78em;line-height:1.5;background:#050505;white-space:pre-wrap;overflow-wrap:anywhere;outline:0}

/* info */
#info .p{display:flex;flex-direction:column;gap:8px}
.rt{font-family:'Lora',serif;border:2px solid #fff;background:#000;padding:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;outline:0;transition:border-color .25s,box-shadow .25s}
.rt:focus{border-color:#f00;box-shadow:0 0 15px rgba(255,0,0,.4)}
.rt:empty:before,#ta:empty:before{content:attr(data-ph);color:#666;pointer-events:none}
#info .rt{flex:1;overflow-y:auto;padding:12px;line-height:1.7}
#right{display:flex;flex-direction:column;overflow:hidden}#right .sec{flex:1 1 0;min-height:150px;display:flex;flex-direction:column}#right .rt{flex:1;min-height:0;overflow-y:auto;font-size:.76em;line-height:1.55}

#info label{font-size:.85em;color:#fff}

.wm{position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:200px;height:200px;opacity:.18;color:#fff;pointer-events:none}
.sec>*:not(.wm){position:relative}
.sec[data-k=cons] .gn,.sec[data-k=cons] .en,.sec[data-k=cons] .sh h3{letter-spacing:.07em;font-weight:400;text-shadow:0 0 8px rgba(255,0,0,.55)}
#right .sh h3{font:400 .85em 'Cinzel',serif;letter-spacing:2px}
.ftb{display:flex;justify-content:center;align-items:baseline;gap:2px}.ftb input{width:2ch}.ftb span{font:700 1.2em 'Cinzel',serif;text-transform:none;letter-spacing:0}
#toast{position:fixed;top:20px;right:20px;padding:14px 20px;background:#000;border:2px solid #0f0;box-shadow:0 0 25px rgba(0,255,0,.4);opacity:0;visibility:hidden;transform:translateX(30px);transition:.35s;z-index:99}
#toast.on{opacity:1;visibility:visible;transform:none}

@media(max-width:1280px){body{height:auto;overflow:auto}main{display:flex!important;flex-direction:column}[data-v=info] #info{display:flex!important}.p{overflow:visible}#info .rt{min-height:260px}#right{overflow:visible}#right .sec{flex:none}#right .rt{min-height:130px;max-height:280px}}
@media(max-width:620px){.top{grid-template-columns:1fr}}
</style>
</head>
<body data-v="sheet">
<header>
 <div class="ttl">Character Codex</div>
 <nav>
  <button class="b on" data-act="v" data-v="sheet">Sheet</button>
  <button class="b" data-act="v" data-v="info">Chronicle</button>
  <button class="b" data-act="exp">Export</button>
  <button class="b" data-act="imp">Import</button>
 </nav>
</header>

<main id="sheet">
 <div class="p" id="left">
  <div class="top">
   <div>
    <div id="pf">
     <img id="pim" alt="">
     <div id="ph">Drop Portrait<small>or click to browse</small></div>
     <div id="hint">Drag to move · Scroll to zoom</div>
     <div class="dfp df"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.500 9-8 11-4.500-2-8-6-8-11V5z"/></svg><input data-f="def" placeholder="0"></div>
     <div class="ov">
      <span class="hp"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><input data-f="hp" placeholder="0">/<input data-f="mhp" placeholder="0"></span>
     </div>
     <div id="hpbar"><i></i></div>
    </div>
    <div class="prow"><button class="b s" data-act="pup">Change</button><button class="b s" id="adj" data-act="adj">Crop</button><input type="range" id="zr" min="1" max="4" step=".01"></div>
   </div>
   <div class="side">
    <input class="nm" data-f="name" placeholder="Name" maxlength="50">
    <input class="tt" data-f="title" placeholder="Title / Epithet…" maxlength="100">
    <div class="g2">
     <label>Race<input data-f="race"></label><label>Level<input data-f="level"></label>
     <label>Alignment<input data-f="align"></label><label>Age<input data-f="age"></label>
    </div>
   </div>
  </div>
  <div class="attrs">
    <div class="at"><span><b>I</b>ndomitability<small>Strength, toughness</small></span><input data-f="I" placeholder="0"></div>
    <div class="at"><span><b>F</b>luidity<small>Initiative, sneak, ranged</small></span><input data-f="F" placeholder="0"></div>
    <div class="at"><span><b>L</b>ucidity<small>Problem-solving, Thaumaturgy</small></span><input data-f="L" placeholder="0"></div>
    <div class="at"><span><b>A</b>uthority<small>Persuasion, leadership</small></span><input data-f="A" placeholder="0"></div>
  </div>
  <div class="sb">
   <div>AT <input data-f="at" placeholder="0">/<input data-f="mat" placeholder="0"></div>
   <div class="ftb"><input data-f="ft" placeholder="0"><span>ft</span></div>
  </div>
   </div>
 <div class="p" id="mid"></div>
 <div class="p" id="right"></div>
</main>

<main id="info">
 <div class="p"><label>Personal History</label><div class="rt" contenteditable data-r="history" data-ph="Character background…"></div></div>
 <div class="p"><label>Goals &amp; Motivations</label><div class="rt" contenteditable data-r="goals" data-ph="What drives this character…"></div></div>
 <div class="p"><label>Diary</label><div class="rt" contenteditable data-r="diary" data-ph="Dear diary…"></div></div>
</main>

<div id="tip"><div id="ta" contenteditable data-ph="What does it do?"></div></div>
<div id="toast"></div>
<input type="file" id="pin" accept="image/*" hidden>
<input type="file" id="ein" accept="image/*" hidden>
<input type="file" id="impf" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 fresh=()=>({f:{},portrait:null,traits:[],bgs:[],thau:[],cons:[],bles:[],cyber:[]});

/* Sections: f = flat list of entries, otherwise groups containing entries */
const SECS=[
 {k:'traits',t:'Traits',f:1,a:'Trait'},
 {k:'bgs',t:'Backgrounds',a:'Background',i:'Ability',p:'Background…'},
 {k:'thau',t:'Thaumaturgy',a:'Facet',i:'Incantation',p:'Facet…'},
 {k:'cons',t:'Contracts',a:'Contract',i:'Boon',p:'Outsider…'},
 {k:'bles',t:'Blessings',a:'Blessing',i:'Power',p:'Blessing…'},
 {k:'cyber',t:'Cybernetics',f:1,a:'Implant'}];
const EQ=[['ew','Weapons','Weapons, damage, notes…'],['ea','Armor & Protection','Armor, resistances…'],['eg','Items & Gear','Items, tools, supplies…']];

/* State — sessionStorage survives reloads but is wiped when the tab closes */
let S=fresh();
try{Object.assign(S,JSON.parse(sessionStorage.getItem('codex')))}catch(e){}
const save=()=>{try{sessionStorage.setItem('codex',JSON.stringify(S))}catch(e){}};
const list=(k,g)=>g===''||g==null?S[k]:S[k][+g].items;
const ent=c=>list(c.dataset.k,c.dataset.g)[+c.dataset.i];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)};

/* Rendering */
/* Section watermarks (white/red line art, 15% opacity) */
const sv=b=>`<svg class="wm" viewBox="-2.1 -2.1 4.2 4.2" fill="none" stroke="currentColor" stroke-width=".04" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`,
 rot=(n,f)=>Array.from({length:n},(_,i)=>f(i*360/n)).join(''),
 STAR='<path d="M0-1.6L.22-.22 1.6 0 .22.22 0 1.6-.22.22-1.6 0-.22-.22Z"/>';
function sigil(){/* four golden-ratio pinwheel rectangles, each spiralled into golden squares, inside a double ring */
 const P=1.618034,c=1/P/2;let [x0,y0,x1,y1]=[-c,-c-1,-c+P,-c],S=[x1,y1],A='',Q='';
 for(let k=0;k<8;k++){const s=Math.min(x1-x0,y1-y0),side='RTLB'[k%4];let q,e;
  if(side=='R'){q=[x1-s,y0,x1,y1];e=[[x1-s,y0],[x1-s,y1]];x1-=s}
  else if(side=='T'){q=[x0,y0,x1,y0+s];e=[[x0,y0+s],[x1,y0+s]];y0+=s}
  else if(side=='L'){q=[x0,y0,x0+s,y1];e=[[x0+s,y0],[x0+s,y1]];x0+=s}
  else{q=[x0,y1-s,x1,y1];e=[[x0,y1-s],[x1,y1-s]];y1-=s}
  Q+=`<rect x="${q[0]}" y="${q[1]}" width="${q[2]-q[0]}" height="${q[3]-q[1]}"/>`;
  const d=p=>Math.hypot(p[0]-S[0],p[1]-S[1]),[C,E]=Math.abs(d(e[0])-s)<Math.abs(d(e[1])-s)?[e[0],e[1]]:[e[1],e[0]],
   cr=(S[0]-C[0])*(E[1]-C[1])-(S[1]-C[1])*(E[0]-C[0]);
  A+=`<path d="M${S[0]} ${S[1]}A${s} ${s} 0 0 ${cr>0?1:0} ${E[0]} ${E[1]}"/>`;S=E}
 return sv('<clipPath id="sgc"><circle r="1.88"/></clipPath><circle r="1.98" stroke-width=".035"/><circle r="1.88" stroke-width=".035"/>'+`<g clip-path="url(#sgc)"><g transform="scale(1.2)" stroke-width=".026"><rect x="${-c}" y="${-c}" width="${2*c}" height="${2*c}"/>`+rot(4,a=>`<g transform="rotate(${a})">${Q}${A}</g>`)+'</g></g><path d="M0-.2L.2 0 0 .2-.2 0Z" stroke="#f00" stroke-width=".03"/><path d="M0-.1L.1 0 0 .1-.1 0Z" stroke="#f00" stroke-width=".03"/>')}
const H='M0-1.95C-1.1-1.95-1.55-1.2-1.5-.2C-1.48.6-1.2 1.3-.7 1.75Q0 2.1.7 1.75C1.2 1.3 1.48.6 1.5-.2C1.55-1.2 1.1-1.95 0-1.95Z',
 FOLD='M-.9-1.3q.2-.2.4 0t.4 0M-1.1-1q.2-.2.4 0t.4 0t.2 0M-.9-.7q.2-.2.4 0t.4 0',
 EYE=x=>`<circle cx="${x}" cy="-.12" r=".4"/><circle cx="${x}" cy="-.12" r=".25"/><circle cx="${x}" cy="-.12" r=".1"/>`;
const face=sv(`<path d="${H}"/><path transform="scale(.93)" d="${H}" stroke-width=".02"/><path d="M-1.5-.45C-1.85-.5-1.9.3-1.6.55M1.5-.45C1.85-.5 1.9.3 1.6.55"/>
 <path d="M-.03-1.65C-.95-1.65-1.28-1.15-1.28-.85C-1.28-.55-1-.45-.7-.45H-.03ZM.03-1.65C.95-1.65 1.28-1.15 1.28-.85C1.28-.55 1-.45.7-.45H.03Z"/><path d="${FOLD}" stroke-width=".02"/><path d="${FOLD}" stroke-width=".02" transform="scale(-1 1)"/>
