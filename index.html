<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Codex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Special+Elite&family=Philosopher:wght@400;700&family=Grenze+Gotisch:wght@400;700&family=Cormorant+Garamond:wght@500;700&family=Arsenal:wght@400;700&family=Chonburi&family=Bevan&family=Jost:wght@800&family=Abril+Fatface&family=Libre+Franklin:wght@800&family=Rozha+One&family=UnifrakturMaguntia&display=swap');
*{box-sizing:border-box}
body{margin:0;height:100vh;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;color:#fff;font-family:'Cinzel',serif;
 background-color:#000;background-image:radial-gradient(circle at 15% 40%,rgba(255,0,0,.1),transparent 50%),radial-gradient(circle at 85% 15%,rgba(0,100,255,.08),transparent 50%)}
input,textarea{font:inherit;color:#fff;background:transparent;border:0;outline:0;min-width:0;transition:box-shadow .25s,background .25s}
input:focus,textarea:focus{box-shadow:0 2px 0 #f00;background:rgba(255,255,255,.04)}
::selection{background:rgba(255,0,0,.4)}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#fff}::-webkit-scrollbar-track{background:#000}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #fff;padding-bottom:10px;position:relative}
header::after{content:'';position:absolute;bottom:-3px;left:0;width:60px;height:3px;background:#f00}
.ttl{font:700 1.7em 'Cinzel Decorative',serif;letter-spacing:4px;text-shadow:0 0 14px rgba(255,255,255,.5)}
nav{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.b{position:relative;overflow:hidden;background:#000;border:2px solid #fff;color:#fff;font:600 .8em 'Cinzel',serif;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;cursor:pointer;
 transition:transform .2s,box-shadow .3s,background .3s,color .3s,border-color .3s}
.b::before{content:'';position:absolute;top:0;left:-120%;width:80%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .55s}
.b:hover::before{left:140%}
.b:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,0,0,.45);border-color:#f00}
.b:active{transform:translateY(1px) scale(.95);box-shadow:0 0 6px #f00}
.b.on{background:#fff;color:#000}
.b.s{padding:4px 10px;font-size:.62em;white-space:nowrap;opacity:0;transition:opacity .4s ease,transform .2s,box-shadow .3s,background .3s,color .3s,border-color .3s}
.sh:hover .b.s,.gh:hover .b.s,.b.s:focus-visible{opacity:1}
@media(hover:none){.b.s{opacity:1}}
.x{background:none;border:0;color:#777;font-size:1.2em;line-height:1;cursor:pointer;padding:0 4px;transition:color .2s,transform .25s}
.x:hover{color:#f00;transform:rotate(90deg) scale(1.2)}

/* layout */
main{flex:1;min-height:0;display:grid;gap:14px;animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
#sheet{grid-template-columns:clamp(500px,36vw,640px) minmax(0,1fr) clamp(260px,22vw,340px)}
#info{display:none;grid-template-columns:1fr 1fr 1.4fr}
[data-v=info] #sheet{display:none}[data-v=info] #info{display:grid}
.p{min-height:0;overflow-y:auto;padding:16px;border:2px solid #fff;background:linear-gradient(135deg,#000,#161616 50%,#000);box-shadow:0 0 25px rgba(255,255,255,.1),inset 0 0 25px #000}
label{display:block;font-size:.6em;letter-spacing:2px;text-transform:uppercase;color:#aaa}
label input{display:block;width:100%;font-size:1.5em;border-bottom:1px solid #555;padding:2px 0}

/* left */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
#pf{position:relative;aspect-ratio:3/4;overflow:hidden;border:2px solid #fff;background:#080808;box-shadow:0 0 25px rgba(255,0,0,.2)}
#pim{position:absolute;display:none;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
#pf.has #pim{display:block}#pf.has #ph{display:none}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:2px dashed #555;margin:10px;cursor:pointer;
 font:700 1.1em 'Cinzel Decorative',serif;letter-spacing:2px;color:#ccc;transition:.3s}
#ph small{font:.55em 'Cinzel',serif;color:#777}#pf:hover #ph{border-color:#fff;background:rgba(255,255,255,.05)}
#pf.adj{cursor:grab;touch-action:none;border-color:#f00}
#hint{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:.6em;letter-spacing:2px;text-shadow:0 0 6px #000;opacity:0;transition:.3s;pointer-events:none}
#pf.adj #hint{opacity:1}
.ov{position:absolute;left:0;right:0;bottom:4px;padding:34px 8px 10px;gap:6px;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.ov span{flex:1;display:flex;align-items:center;gap:3px;padding:3px 9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(3px)}
.ov svg{width:20px;height:20px;fill:currentColor;flex:none}
.dfp{position:absolute;top:8px;right:8px;max-width:62%;display:flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(3px)}.dfp svg{width:20px;height:20px;fill:#fff;flex:none}.dfp input{width:8ch;min-width:0;text-align:center;font:700 1.15em 'Cinzel Decorative',serif;text-shadow:0 2px 8px #000}
.hp{color:#f22}.hp svg{filter:drop-shadow(0 0 7px #f00)}.df svg{filter:drop-shadow(0 0 6px #fff)}
.ov input{flex:1;width:0;min-width:0;text-align:center;font:700 1.15em 'Cinzel Decorative',serif;text-shadow:0 2px 8px #000,0 0 12px rgba(255,255,255,.4)}
#hpbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#300}
#hpbar i{display:block;height:100%;width:0;background:#f00;box-shadow:0 0 10px #f00;transition:width .5s}
.prow{display:flex;gap:6px;align-items:center;margin-top:8px}
#zr{display:none;flex:1;accent-color:#f00}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.nm{font:700 1.7em 'Cinzel Decorative',serif;text-shadow:0 0 12px rgba(255,255,255,.5);border-bottom:3px solid #fff;padding:2px 0;width:100%}
.tt{font-style:italic;color:#ccc;border-bottom:1px solid #555;padding:2px 0;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 input{font-size:1.05em}
.at{display:flex;align-items:center;gap:8px;border:1px solid #fff;padding:4px 8px;background:#050505;transition:.25s}
.at:hover{border-color:#f00;box-shadow:0 0 14px rgba(255,0,0,.3)}
.at b{font:700 1.7em 'Cinzel Decorative',serif;margin-right:1px}
.at span{flex:1;font-size:.82em;font-weight:700;letter-spacing:1px;line-height:1.2}
.at small{display:block;font-size:.72em;font-weight:400;color:#aaa;text-transform:none;font-style:italic;letter-spacing:0}
.at input{width:46px;height:40px;text-align:center;border:2px solid #fff;font:700 1.3em 'Cinzel Decorative',serif;background:#000}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sb div{border:2px solid #fff;padding:8px;text-align:center;background:#050505;font-size:.75em;letter-spacing:2px;text-transform:uppercase}
.sb input{width:5ch;text-align:center;font:700 1.5em 'Cinzel Decorative',serif;border-bottom:2px solid #fff}

/* sections */
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid #fff;padding-bottom:6px;margin:0 0 10px}
.sh h3{margin:0;font:700 1.1em 'Cinzel Decorative',serif;letter-spacing:3px;text-transform:uppercase}
.sec{position:relative;overflow:hidden;min-height:150px;margin-bottom:18px;padding:10px;border:2px solid #fff;background:linear-gradient(135deg,#000,#0a0a0a);box-shadow:inset 0 0 15px #000}
.sec[data-k=traits]{--f:'Rubik Dirt',system-ui}.sec[data-k=bgs]{--f:'Special Elite',monospace}.sec[data-k=thau]{--f:'Philosopher',serif}.sec[data-k=cons]{--f:'Arsenal',sans-serif}.sec[data-k=bles]{--f:'Cormorant Garamond',serif}
.sec[data-k=bles] .sh h3,.sec[data-k=bles] .gn,.sec[data-k=bles] .en{font-weight:700}
.sec[data-k] .sh h3,.sec[data-k] .gn,.sec[data-k] .en{font-family:var(--f)}
.grp{border:1px solid #666;padding:8px;margin-bottom:10px;background:#050505}
.gh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.gn{flex:1;font-weight:700;font-size:1em;letter-spacing:1px;border-bottom:2px solid #fff;padding:3px 0}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.ent{min-width:0;display:flex;align-items:center;gap:6px;padding:3px 6px;background:#0b0b0b;border-left:3px solid var(--c,#fff);animation:fi .3s;transition:background .2s,border-color .2s,padding-left .2s}
.ent:hover{background:#181818;border-color:#f00;padding-left:10px}
.en{flex:1;width:100%;font-size:.88em;padding:3px 0}
.th{width:30px;height:30px;flex:none;border:1px dashed #666;display:flex;align-items:center;justify-content:center;color:#777;cursor:pointer;overflow:hidden;transition:.2s}.th:hover{border-color:#fff;color:#fff}.th img{width:100%;height:100%;object-fit:cover}

/* hover box */
#tip{position:fixed;z-index:50;width:max-content;max-width:min(560px,94vw);padding:10px;align-items:flex-start;background:#000;border:2px solid #fff;box-shadow:0 0 30px rgba(255,255,255,.2);
 display:flex;gap:10px;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .2s,transform .2s,visibility .2s}
#tip.on{opacity:1;visibility:visible;transform:none}
#ta{min-width:190px;max-width:440px;min-height:72px;border:1px solid #555;padding:6px;font-size:.78em;line-height:1.5;background:#050505;white-space:pre-wrap;overflow-wrap:anywhere;outline:0}

/* info */
#info .p{display:flex;flex-direction:column;gap:8px}
.rt{border:2px solid #fff;background:#000;padding:10px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;outline:0;transition:border-color .25s,box-shadow .25s}
.rt:focus{border-color:#f00;box-shadow:0 0 15px rgba(255,0,0,.4)}
.rt:empty:before,#ta:empty:before{content:attr(data-ph);color:#666;pointer-events:none}
#info .rt{flex:1;overflow-y:auto;padding:12px;line-height:1.7}
#right{display:flex;flex-direction:column}#right .sec{flex:1;display:flex;flex-direction:column}#right .rt{flex:1;min-height:130px}

#info label{font-size:.85em;color:#fff}

.wm{position:absolute;right:-26px;top:50%;transform:translateY(-50%);width:200px;height:200px;opacity:.18;color:#fff;pointer-events:none}
.sec>*:not(.wm){position:relative}
.sec[data-k=cons] .gn,.sec[data-k=cons] .en{font-weight:700;letter-spacing:.06em}
.gn{min-width:0;outline:0;white-space:nowrap;overflow:hidden}.gn:empty:before{content:attr(data-ph);color:#666;font-weight:400}.sp{display:inline-block;width:.4em;white-space:pre}
.rl{display:inline-block;padding:0 4px;margin:0 1px;line-height:1.1;letter-spacing:0;box-shadow:2px 2px 0 #f00}
#toast{position:fixed;top:20px;right:20px;padding:14px 20px;background:#000;border:2px solid #0f0;box-shadow:0 0 25px rgba(0,255,0,.4);opacity:0;visibility:hidden;transform:translateX(30px);transition:.35s;z-index:99}
#toast.on{opacity:1;visibility:visible;transform:none}

@media(max-width:1150px){body{height:auto;overflow:auto}main{display:flex!important;flex-direction:column}[data-v=info] #info{display:flex!important}.p{overflow:visible}#info .rt{min-height:260px}}
@media(max-width:620px){.top{grid-template-columns:1fr}}
</style>
</head>
<body data-v="sheet">
<header>
 <div class="ttl">Character Codex</div>
 <nav>
  <button class="b on" data-act="v" data-v="sheet">Sheet</button>
  <button class="b" data-act="v" data-v="info">Chronicle</button>
  <button class="b" data-act="exp">Export</button>
  <button class="b" data-act="imp">Import</button>
 </nav>
</header>

<main id="sheet">
 <div class="p" id="left">
  <div class="top">
   <div>
    <div id="pf">
     <img id="pim" alt="">
     <div id="ph">Drop Portrait<small>or click to browse</small></div>
     <div id="hint">Drag to move · Scroll to zoom</div>
     <div class="dfp df"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.500 9-8 11-4.500-2-8-6-8-11V5z"/></svg><input data-f="def" placeholder="0"></div>
     <div class="ov">
      <span class="hp"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><input data-f="hp" placeholder="0">/<input data-f="mhp" placeholder="0"></span>
     </div>
     <div id="hpbar"><i></i></div>
    </div>
    <div class="prow"><button class="b s" data-act="pup">Change</button><button class="b s" id="adj" data-act="adj">Crop</button><input type="range" id="zr" min="1" max="4" step=".01"></div>
   </div>
   <div class="side">
    <input class="nm" data-f="name" placeholder="Name" maxlength="50">
    <input class="tt" data-f="title" placeholder="Titles, Epithets, Monikers…" maxlength="100">
    <div class="g2">
     <label>Race<input data-f="race"></label><label>Level<input data-f="level"></label>
     <label>Alignment<input data-f="align"></label><label>Age<input data-f="age"></label>
    </div>
    <div class="at"><span><b>I</b>ndomitability<small>Strength, toughness</small></span><input data-f="I" placeholder="0"></div>
    <div class="at"><span><b>F</b>luidity<small>Initiative, sneak, ranged</small></span><input data-f="F" placeholder="0"></div>
    <div class="at"><span><b>L</b>ucidity<small>Problem-solving, Thaumaturgy</small></span><input data-f="L" placeholder="0"></div>
    <div class="at"><span><b>A</b>uthority<small>Persuasion, leadership</small></span><input data-f="A" placeholder="0"></div>
   </div>
  </div>
  <div class="sb">
   <div>AT <input data-f="at" placeholder="0">/<input data-f="mat" placeholder="0"></div>
   <div>FT <input data-f="ft" placeholder="0"></div>
  </div>
   </div>
 <div class="p" id="mid"></div>
 <div class="p" id="right"></div>
</main>

<main id="info">
 <div class="p"><label>Personal History</label><div class="rt" contenteditable data-r="history" data-ph="Character background…"></div></div>
 <div class="p"><label>Goals &amp; Motivations</label><div class="rt" contenteditable data-r="goals" data-ph="What drives this character…"></div></div>
 <div class="p"><label>Diary</label><div class="rt" contenteditable data-r="diary" data-ph="Dear diary…"></div></div>
</main>

<div id="tip"><div id="ta" contenteditable data-ph="What does it do?"></div></div>
<div id="toast"></div>
<input type="file" id="pin" accept="image/*" hidden>
<input type="file" id="ein" accept="image/*" hidden>
<input type="file" id="impf" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 fresh=()=>({f:{},portrait:null,traits:[],bgs:[],thau:[],cons:[],bles:[]});

/* Sections: f = flat list of entries, otherwise groups containing entries */
const SECS=[
 {k:'traits',t:'Traits',f:1,a:'Trait'},
 {k:'bgs',t:'Backgrounds',a:'Background',i:'Ability',p:'Background…'},
 {k:'thau',t:'Thaumaturgy',a:'Facet',i:'Incantation',p:'Facet…'},
 {k:'cons',t:'Contracts',a:'Contract',i:'Boon',p:'Outsider…'},
 {k:'bles',t:'Blessings',a:'Blessing',i:'Power',p:'Blessing…'}];
const EQ=[['ew','Weapons','Weapons, damage, notes…'],['ea','Armor & Protection','Armor, resistances…'],['eg','Items & Gear','Items, tools, supplies…']];

/* State — sessionStorage survives reloads but is wiped when the tab closes */
let S=fresh();
try{Object.assign(S,JSON.parse(sessionStorage.getItem('codex')))}catch(e){}
const save=()=>{try{sessionStorage.setItem('codex',JSON.stringify(S))}catch(e){}};
const list=(k,g)=>g===''||g==null?S[k]:S[k][+g].items;
const ent=c=>list(c.dataset.k,c.dataset.g)[+c.dataset.i];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)};

/* Rendering */
/* Persona-style lettering: every letter gets its own font, size, tilt and box (see the P5R font guide) */
const RF=['Chonburi','Bevan','Jost','Abril Fatface','Libre Franklin','Rozha One'],RC=[['#000','#fff'],['#fff','#000'],['#f00','#fff'],['#000','#fff'],['#fff','#000']];
const ransom=(t,z=1.1)=>[...t].map((ch,i)=>{if(/\s/.test(ch))return '<span class="sp"> </span>';const h=(ch.charCodeAt(0)*31+i*17)%97,c=RC[h%5];
 return `<span class="rl" style="font-family:'${RF[h%6]}',serif;font-weight:800;font-size:${(z*(.85+h%5*.1)).toFixed(2)}em;transform:rotate(${h%9-4}deg);text-transform:${i%2?'lowercase':'uppercase'};background:${c[0]};color:${c[1]}">${esc(ch)}</span>`}).join('');
const caret=el=>{const g=getSelection();if(!g.rangeCount)return 0;const r=g.getRangeAt(0),q=r.cloneRange();q.selectNodeContents(el);q.setEnd(r.endContainer,r.endOffset);return q.toString().length};
function setCaret(el,n){const w=document.createTreeWalker(el,4),r=document.createRange(),g=getSelection();let t;
 while(t=w.nextNode()){if(n<=t.length){r.setStart(t,n);break}n-=t.length}if(!t)r.setStart(el,0);r.collapse(true);g.removeAllRanges();g.addRange(r)}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.classList?.contains('gn'))e.preventDefault()});
/* Section watermarks (white/red line art, 15% opacity) */
const sv=b=>`<svg class="wm" viewBox="-2.1 -2.1 4.2 4.2" fill="none" stroke="currentColor" stroke-width=".04" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`,
 rot=(n,f)=>Array.from({length:n},(_,i)=>f(i*360/n)).join(''),
 STAR='<path d="M0-1.6L.22-.22 1.6 0 .22.22 0 1.6-.22.22-1.6 0-.22-.22Z"/>';
function sigil(){/* four golden-ratio pinwheel rectangles, each spiralled into golden squares, inside a double ring */
 const P=1.618034,c=1/P/2;let [x0,y0,x1,y1]=[-c,-c-1,-c+P,-c],S=[x1,y1],A='',Q='';
 for(let k=0;k<8;k++){const s=Math.min(x1-x0,y1-y0),side='RTLB'[k%4];let q,e;
  if(side=='R'){q=[x1-s,y0,x1,y1];e=[[x1-s,y0],[x1-s,y1]];x1-=s}
  else if(side=='T'){q=[x0,y0,x1,y0+s];e=[[x0,y0+s],[x1,y0+s]];y0+=s}
  else if(side=='L'){q=[x0,y0,x0+s,y1];e=[[x0+s,y0],[x0+s,y1]];x0+=s}
  else{q=[x0,y1-s,x1,y1];e=[[x0,y1-s],[x1,y1-s]];y1-=s}
  Q+=`<rect x="${q[0]}" y="${q[1]}" width="${q[2]-q[0]}" height="${q[3]-q[1]}"/>`;
  const d=p=>Math.hypot(p[0]-S[0],p[1]-S[1]),[C,E]=Math.abs(d(e[0])-s)<Math.abs(d(e[1])-s)?[e[0],e[1]]:[e[1],e[0]],
   cr=(S[0]-C[0])*(E[1]-C[1])-(S[1]-C[1])*(E[0]-C[0]);
  A+=`<path d="M${S[0]} ${S[1]}A${s} ${s} 0 0 ${cr>0?1:0} ${E[0]} ${E[1]}"/>`;S=E}
 return sv('<clipPath id="sgc"><circle r="1.88"/></clipPath><circle r="1.98" stroke-width=".035"/><circle r="1.88" stroke-width=".035"/>'+`<g clip-path="url(#sgc)"><g transform="scale(1.2)" stroke-width=".026"><rect x="${-c}" y="${-c}" width="${2*c}" height="${2*c}"/>`+rot(4,a=>`<g transform="rotate(${a})">${Q}${A}</g>`)+'</g></g><path d="M0-.2L.2 0 0 .2-.2 0Z" stroke="#f00" stroke-width=".03"/><path d="M0-.1L.1 0 0 .1-.1 0Z" stroke="#f00" stroke-width=".03"/>')}
const H='M0-1.95C-1.1-1.95-1.55-1.2-1.5-.2C-1.48.6-1.2 1.3-.7 1.75Q0 2.1.7 1.75C1.2 1.3 1.48.6 1.5-.2C1.55-1.2 1.1-1.95 0-1.95Z',
 FOLD='M-.9-1.3q.2-.2.4 0t.4 0M-1.1-1q.2-.2.4 0t.4 0t.2 0M-.9-.7q.2-.2.4 0t.4 0',
 EYE=x=>`<circle cx="${x}" cy="-.12" r=".4"/><circle cx="${x}" cy="-.12" r=".25"/><circle cx="${x}" cy="-.12" r=".1"/>`;
const face=sv(`<path d="${H}"/><path transform="scale(.93)" d="${H}" stroke-width=".02"/><path d="M-1.5-.45C-1.85-.5-1.9.3-1.6.55M1.5-.45C1.85-.5 1.9.3 1.6.55"/>
 <path d="M-.03-1.65C-.95-1.65-1.28-1.15-1.28-.85C-1.28-.55-1-.45-.7-.45H-.03ZM.03-1.65C.95-1.65 1.28-1.15 1.28-.85C1.28-.55 1-.45.7-.45H.03Z"/><path d="${FOLD}" stroke-width=".02"/><path d="${FOLD}" stroke-width=".02" transform="scale(-1 1)"/>
 ${EYE(-.62)}${EYE(.62)}<path d="M-.1-.3C-.1.1-.3.3-.28.75M.1-.3C.1.1.3.3.28.75M0-.35V.85M-.28.05Q-.5.2-.28.4M.28.05Q.5.2.28.4M-1.15.1Q-.9.9-.4.85M1.15.1Q.9.9.4.85"/>
 <path d="M-.7 1v.4M-.5.95v.45M-.3.95v.45M.3.95v.45M.5.95v.45M.7 1v.4M0 1.2V1.7M-.2 1.25Q-.25 1.5-.18 1.68M.2 1.25Q.25 1.5.18 1.68"/><ellipse cy="1.45" rx=".38" ry=".28"/>`);
/* side-view brain: gyri are rippled arcs wrapping the lateral fissure, broken into folds, clipped to the cerebrum */
const brain=(()=>{const O='M-1.8.15C-1.95-.6-1.3-1.4-.3-1.5C.7-1.6 1.7-1.1 1.8-.25C1.85.2 1.6.55 1.2.62C.8.7.4.55-.1.7C-.5.85-1 .85-1.4.6C-1.65.5-1.78.35-1.8.15Z',cx=-.15,cy=.4,T=Math.PI,
 P=(r,t)=>{const R=r+.08*Math.sin(t*11+r*5)+.04*Math.sin(t*23+r*9);return[cx+R*Math.cos(t),cy+R*Math.sin(t)*.78]},f=n=>n.toFixed(2);let g='';
 const arc=(r,t0,t1)=>{let d='';for(let t=t0;t<=t1;t+=.035){const[x,y]=P(r,t);d+=(d?'L':'M')+f(x)+' '+f(y)}return `<path d="${d}"/>`},
  tick=(r,t)=>{const[a,b]=P(r,t),[c,e]=P(r+.25,t+.05);return `<path d="M${f(a)} ${f(b)}L${f(c)} ${f(e)}"/>`};
 for(let r=.5;r<2.3;r+=.25){g+=arc(r,T,2*T);for(let t=T+.15+(Math.sin(r*37)+1)*.2;t<2*T;t+=.3+.25*Math.abs(Math.sin(t*13+r*7)))g+=tick(r,t)}
 for(let r=.95;r<1.7;r+=.25){g+=arc(r,.12,T-.12);for(let t=.2+(Math.sin(r*37)+1)*.2;t<T-.1;t+=.3+.25*Math.abs(Math.sin(t*13+r*7)))g+=tick(r,t)}
 return sv(`<clipPath id="bc"><path d="${O}"/></clipPath><g clip-path="url(#bc)" stroke-width=".025">${g}</g><path d="${O}"/><path d="M-1.7.3C-1.1.15-.5.25.1-.05" stroke-width=".05"/><path d="M.7.78C1.1.68 1.6.72 1.65 1.05C1.6 1.45 1 1.55.6 1.3C.4 1.15.5.92.7.78Z"/><path d="M.68.98Q1.15.88 1.6.98M.65 1.12Q1.1 1.02 1.6 1.12M.7 1.27Q1.1 1.17 1.5 1.3" stroke-width=".025"/><path d="M-.15.78C-.05 1.2.05 1.6.3 1.95L.65 1.85C.55 1.5.5 1.15.5.9"/>`)})();
const sun=sv('<circle r="1.78" stroke-dasharray=".4 .2"/>'+rot(12,a=>`<path d="M0-.9Q.16-1.2-.08-1.5T0-1.95" transform="rotate(${a})"/><path d="M0-.92V-1.2" transform="rotate(${a+15})"/>`)+'<circle r=".78"/><circle r=".72" stroke-width=".02"/><path d="M-.55 0Q0-.42.55 0Q0 .42-.55 0Z"/><circle r=".17"/><circle r=".07"/>'+[-60,-40,-20,0,20,40,60].map(a=>`<path d="M0-.5v-.12" transform="rotate(${a})"/>`).join(''));
const WM={
 traits:face,
 bgs:sv('<path d="M-.8-.78V-1.95H.8V-.78"/><path d="M-.6-1.7H.6M-.6-1.5H.45M-.6-1.3H.55M-.6-1.1H.25" stroke-width=".03"/><path d="M-.6-.95H.05" stroke="#f00" stroke-width=".05"/><rect x="-1.5" y="-.8" width="3" height=".32" rx=".16"/><path d="M-1.25-.8v.32M-.75-.8v.32M-.25-.8v.32M.25-.8v.32M.75-.8v.32M1.25-.8v.32" stroke-width=".02"/>'+[-1,1].map(d=>`<path d="M${d*1.5}-.64H${d*1.68}"/><circle cx="${d*1.85}" cy="-.64" r=".2"/><circle cx="${d*1.85}" cy="-.64" r=".08"/>`).join('')+Array.from({length:9},(_,i)=>{const x=-.8+i*.2;return `<path d="M${x*.4} -.12L${x} -.44" stroke-width=".025"/><circle cx="${x}" cy="-.46" r=".03"/>`}).join('')+'<path d="M-1.5-.26H1.5Q1.65-.26 1.7-.1L2 1.4V1.75Q2 1.85 1.9 1.85H-1.9Q-2 1.85-2 1.75V1.4L-1.7-.1Q-1.65-.26-1.5-.26Z"/>'+[[.1,-1.44,9],[.46,-1.26,8],[.82,-1.44,9],[1.18,-1.08,7]].map(([y,x0,n])=>Array.from({length:n},(_,i)=>`<circle cx="${x0+i*.36}" cy="${y}" r=".12"/><circle cx="${x0+i*.36}" cy="${y}" r=".05" stroke-width=".02"/>`).join('')).join('')+'<rect x="-.8" y="1.46" width="1.6" height=".14" rx=".07"/><circle cx="-.36" cy=".46" r=".12" stroke="#f00"/>'),
 thau:brain,
 cons:sigil(),
 bles:sun};
const entHTML=(k,g,i,e)=>`<div class="ent" data-k="${k}" data-g="${g}" data-i="${i}"><div class="th" data-act="img">${e.img?`<img src="${e.img}">`:'＋'}</div><input class="en" placeholder="Name…" value="${esc(e.n)}"><button class="x" data-act="delI">×</button></div>`;
const secHTML=c=>`<section class="sec" data-k="${c.k}" data-g="">${WM[c.k]}<div class="sh"><h3>${c.k=='cons'?ransom(c.t,1):c.t}</h3><button class="b s" data-act="${c.f?'addI':'addG'}">+${c.a}</button></div>`+
 (c.f?`<div class="list">${S[c.k].map((e,i)=>entHTML(c.k,'',i,e)).join('')}</div>`
 :S[c.k].map((g,j)=>`<div class="grp" data-k="${c.k}" data-g="${j}"><div class="gh">${c.k=='cons'?`<div class="gn" contenteditable data-ph="${c.p}">${ransom(g.n)}</div>`:`<input class="gn" placeholder="${c.p}" value="${esc(g.n)}">`}<button class="b s" data-act="addI">+${c.i}</button><button class="x" data-act="delG">×</button></div><div class="list">${g.items.map((e,i)=>entHTML(c.k,j,i,e)).join('')}</div></div>`).join(''))+`</section>`;
function renderMid(){const m=$('#mid'),y=m.scrollTop;m.innerHTML=SECS.map(secHTML).join('');m.scrollTop=y;fitAll()}
function renderEq(){$('#right').innerHTML=EQ.map(([k,t,p])=>`<section class="sec"><div class="sh"><h3>${t}</h3></div><div class="rt" contenteditable data-r="${k}" data-ph="${p}"></div></section>`).join('');bindR()}
const bindR=()=>document.querySelectorAll('[data-r]').forEach(el=>el.innerHTML=clean(S.f[el.dataset.r]||''));
const clean=h=>{const o=document.createElement('div');(function w(n,p){n.childNodes.forEach(c=>{if(c.nodeType==3)p.append(c.textContent);else if(c.nodeType==1){const t=c.tagName.toLowerCase(),k=['b','strong','i','em','u','br','div'].includes(t)?p.appendChild(document.createElement(t)):p;if(t!='br')w(c,k)}})})(new DOMParser().parseFromString(h,'text/html').body,o);return o.innerHTML};
/* names shrink to fit their box */
const FIT='.nm,.tt,.en,.gn,.g2 input,.ov input,.dfp input';
function fit(el){el.style.fontSize='';let z=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&z>9){z--;el.style.fontSize=z+'px'}}
const fitAll=()=>document.querySelectorAll(FIT).forEach(fit);
function updHP(){const h=parseFloat(S.f.hp),m=parseFloat(S.f.mhp);$('#hpbar i').style.width=(m>0?Math.max(0,Math.min(100,h/m*100)):0)+'%'}

/* Image helpers */
const load=(f,cb)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=r.result};r.readAsDataURL(f)};
const sq=(f,n,cb)=>load(f,im=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n);cb(c.toDataURL('image/jpeg',.85))});

/* Portrait: stored whole, cropped by pan/zoom. Units are fractions of frame width; frame is 3:4 */
const FR=4/3,pf=$('#pf'),pim=$('#pim');let ps='',dg=0;
const minZ=p=>Math.max(1,FR/p.r);
function renderP(){const p=S.portrait,W=pf.offsetWidth;pf.classList.toggle('has',!!p);if(!p)return;
 p.z=Math.min(Math.max(p.z,minZ(p)),minZ(p)*4);p.x=Math.min(0,Math.max(1-p.z,p.x));p.y=Math.min(0,Math.max(FR-p.z*p.r,p.y));
 if(ps!==p.src){pim.src=p.src;ps=p.src}
 pim.style.cssText=`width:${p.z*W}px;left:${p.x*W}px;top:${p.y*W}px`;$('#zr').value=p.z/minZ(p)}
function zoomP(nz){const p=S.portrait,o=p.z;p.z=nz;p.x=.5-(.5-p.x)*nz/o;p.y=FR/2-(FR/2-p.y)*nz/o;renderP();save()}
function loadP(f){load(f,im=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const p=S.portrait={src:c.toDataURL('image/jpeg',.85),r:c.height/c.width,z:1,x:0,y:0};p.z=minZ(p);p.x=(1-p.z)/2;p.y=(FR-p.z*p.r)/2;save();renderP()})}
pf.ondragover=e=>e.preventDefault();
pf.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&f.type.startsWith('image/')&&loadP(f)};
pf.onpointerdown=e=>{if(!pf.classList.contains('adj')||!S.portrait||e.target.closest('input'))return;dg=[e.clientX,e.clientY];pf.setPointerCapture(e.pointerId)};
pf.onpointermove=e=>{if(!dg)return;const p=S.portrait,W=pf.offsetWidth;p.x+=(e.clientX-dg[0])/W;p.y+=(e.clientY-dg[1])/W;dg=[e.clientX,e.clientY];renderP()};
pf.onpointerup=()=>{if(dg){dg=0;save()}};
pf.addEventListener('wheel',e=>{if(!pf.classList.contains('adj')||!S.portrait)return;e.preventDefault();zoomP(S.portrait.z*(e.deltaY<0?1.08:.93))},{passive:false});
$('#zr').oninput=e=>S.portrait&&zoomP(+e.target.value*minZ(S.portrait));
$('#pin').onchange=e=>{e.target.files[0]&&loadP(e.target.files[0]);e.target.value=''};
window.addEventListener('resize',renderP);

/* Hover box: opens 0.5s after hovering an entry */
const tip=$('#tip'),ta=$('#ta');let ref,tr,hide;
function showTip(en){const r0=en.isConnected&&ent(en);if(!r0)return;ref=r0;ta.innerHTML=clean(ref.d||'');const r=en.getBoundingClientRect(),h=150;
 const up=r.bottom+h>innerHeight;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-580))+'px';tip.style.top=up?'auto':r.bottom-2+'px';tip.style.bottom=up?innerHeight-r.top-2+'px':'auto';tip.classList.add('on')}
const hideTip=()=>{if(!tip.contains(document.activeElement)){tip.classList.remove('on')}};
document.addEventListener('mouseover',e=>{
 const en=e.target.closest('.ent');
 if(en){clearTimeout(hide);if(tip.classList.contains('on')&&ref===ent(en))return;clearTimeout(tr);tr=setTimeout(()=>showTip(en),200)}
 else if(e.target.closest('#tip'))clearTimeout(hide)});
document.addEventListener('mouseout',e=>{if(e.target.closest('.ent,#tip')){clearTimeout(tr);hide=setTimeout(hideTip,250)}});
ta.onblur=()=>setTimeout(()=>{if(!tip.matches(':hover'))tip.classList.remove('on')},200);
$('#ein').onchange=e=>{const f=e.target.files[0];if(f&&tgt)sq(f,160,d=>{tgt.img=d;save();renderMid()});e.target.value=''};

/* Input + clicks (delegated, so re-rendering never loses handlers) */
document.addEventListener('input',e=>{const t=e.target,c=t.closest('[data-k]'),d=t.dataset;if(t.isContentEditable&&!t.textContent.trim()&&t.innerHTML)t.innerHTML='';if(t.matches(FIT))fit(t);
 if(d.f){S.f[d.f]=t.value;if(d.f=='name')document.title=t.value.trim()||'Character Codex';if(d.f=='hp'||d.f=='mhp')updHP()}
 else if(t.classList.contains('en'))ent(c).n=t.value;
 else if(t.classList.contains('gn')){const v=t.isContentEditable?t.textContent.replace(/\u00a0/g,' '):t.value;S[c.dataset.k][+c.dataset.g].n=v;if(t.isContentEditable){const o=caret(t);t.innerHTML=ransom(v);setCaret(t,o)}}
 else if(d.r)S.f[d.r]=t.innerHTML;
 else if(t.id=='ta'&&ref)ref.d=t.innerHTML;
 save()});

let tgt;const A={img(b){tgt=ent(b.closest('[data-k]'));$('#ein').click()},
 v(b){document.body.dataset.v=b.dataset.v;document.querySelectorAll('[data-act=v]').forEach(x=>x.classList.toggle('on',x==b))},
 imp(){$('#impf').click()},pup(){$('#pin').click()},
 adj(){const on=pf.classList.toggle('adj');$('#adj').classList.toggle('on',on);$('#zr').style.display=on?'block':'none'},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:3,data:S})],{type:'application/json'}));
  a.download=(S.f.name||'character').replace(/\W/g,'')+'.json';a.click();toast('Character exported')}};

document.addEventListener('click',e=>{
 if(e.target.closest('#pf')&&!S.portrait&&!e.target.closest('input'))return $('#pin').click();
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(A[a])return A[a](b);
 const c=b.closest('[data-k]'),k=c?.dataset.k,g=c?.dataset.g,i=+c?.dataset.i;
 if(a=='addI')list(k,g).push({n:'',d:'',img:''});
 else if(a=='addG')S[k].push({n:'',items:[]});
 else if(a=='delI')list(k,g).splice(i,1);
 else if(a=='delG')S[k].splice(+g,1);
 
 
 clearTimeout(tr);tip.classList.remove('on');save();renderMid();
 if(/^add/.test(a)){const q=a=='addG'?`.sec[data-k="${k}"] .gn`:`${g===''?'.sec':'.grp'}[data-k="${k}"][data-g="${g}"] .en`;
  [...document.querySelectorAll(q)].pop()?.focus()}});

/* Import (older v2 exports bring over their basic fields) */
const M={characterName:'name',titles:'title',race:'race',level:'level',age:'age',alignment:'align',indomitability:'I',fluidity:'F',lucidity:'L',authority:'A',currentHP:'hp',maxHP:'mhp',defense:'def',currentAtramenta:'at',maxAtramenta:'mat',movement:'ft'};
function migrate(d){const s=fresh();for(const k in M)s.f[M[k]]=d[k]||'';
 ['history','goals'].forEach(k=>s.f[k]=new DOMParser().parseFromString(d[k]||'','text/html').body.textContent);return s}
$('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);S=j.v>=3?Object.assign(fresh(),j.data):migrate(j.data||j);save();init();toast('Character imported')}catch(x){toast('Invalid file')}};
 r.readAsText(f);e.target.value=''};

function init(){
 document.querySelectorAll('[data-f]').forEach(el=>el.value=S.f[el.dataset.f]??'');
 document.title=(S.f.name||'').trim()||'Character Codex';
 tip.classList.remove('on');ps='';renderMid();renderEq();renderP();updHP();fitAll();document.fonts?.ready.then(fitAll)}
document.addEventListener('paste',e=>{if(!e.target.isContentEditable)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('.th'),en=t&&ent(t.closest('[data-k]'));if(en&&en.img){e.preventDefault();en.img='';save();renderMid()}});
addEventListener('resize',fitAll);
init();
</script>
